services:
  redis:
    image: redis:7-alpine
    container_name: redis_service
    volumes:
      - redis_data:/data
    networks:
      - app-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  flask:
    build: .
    container_name: flask_url
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    networks:
      - app-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask

volumes:
  redis_data:

networks:
  app-net:

